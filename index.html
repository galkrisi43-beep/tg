<!--
  Pini landing. Same page on /, /v4/, and /v5/ (generated from build-src/template.html).
  TikTok bio points at /v4/.
  TikTok's bio webview blocks every escape (intents, deep links, t.me), so
  the in-TikTok view only guides the user: ⋯ → «פתח בדפדפן» → הצטרפו.
  Arrows point to BOTH top corners (⋯ is top-right on some phones, top-left on others).
  Real browser, or ?from=tt: Telegram + WhatsApp join buttons. No auto-redirect.
-->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1060">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="פיני מוצא לך בזול — הכניסה לקבוצות בטלגרם ובוואטסאפ">
  <title>פיני מוצא לך בזול💵🦝</title>
  <link rel="icon" href="pini.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="pini.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffd34d;
      --ink: #ffffff;
      --muted: rgba(255,255,255,.78);
      --tg: #229ed9;
      --wa: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,90,170,.45) 0, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(255,190,60,.35) 0, transparent 45%),
        linear-gradient(160deg, #3b1078 0%, #24135e 45%, #0f1a4a 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Heebo", "Rubik", "Arial Hebrew", "Noto Sans Hebrew", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    body.tiktok { justify-content: flex-start; padding-top: calc(118px + env(safe-area-inset-top)); }
    main { width: 100%; max-width: 400px; text-align: center; }

    .avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
      border: 4px solid var(--gold);
      box-shadow: 0 0 0 6px rgba(255,211,77,.18), 0 10px 30px rgba(0,0,0,.35);
    }
    h1 { font-size: 1.7rem; font-weight: 900; line-height: 1.2; margin: 12px 0 4px; letter-spacing: -.3px; }
    .sub { color: var(--muted); font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; }

    /* ---------- In-TikTok view ---------- */
    .corner {
      display: none; position: fixed; z-index: 30; pointer-events: none;
      top: calc(4px + env(safe-area-inset-top));
      flex-direction: column; align-items: center; width: 150px; direction: ltr;
    }
    body.tiktok .corner { display: flex; }
    .corner.r { right: 2px; align-items: flex-end; }
    .corner.l { align-items: flex-start; }
    .corner.l { left: 2px; }
    .corner svg { width: 62px; height: 62px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
    .corner.r svg { animation: bounceR .8s ease-in-out infinite; }
    .corner.l svg { animation: bounceL .8s ease-in-out infinite; }
    .corner .lbl {
      margin-top: 2px; background: var(--gold); color: #2a1060;
      font-weight: 900; font-size: .82rem; line-height: 1.3; white-space: nowrap; text-align: center; direction: rtl;
      padding: 7px 10px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    @keyframes bounceR { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-9px); } }
    @keyframes bounceL { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-6px,-9px); } }

    #guide { display: none; }
    body.tiktok #guide { display: block; }
    body.tiktok #apps { display: none; }

    .steps { display: flex; flex-direction: column; gap: 12px; }
    .step {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,.1);
      border: 1.5px solid rgba(255,255,255,.18);
      border-radius: 20px; padding: 14px 16px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .num {
      flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
      background: var(--gold); color: #2a1060; font-weight: 900; font-size: 1.15rem;
      display: flex; align-items: center; justify-content: center;
    }
    .step .txt { flex: 1; text-align: right; font-size: 1.22rem; font-weight: 800; }
    .step .vis { flex: 0 0 auto; }
    .dots-ico {
      width: 52px; height: 40px; border-radius: 12px; background: #fff;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .dots-ico i { width: 7px; height: 7px; border-radius: 50%; background: #161823; display: block; }
    .menu-ico {
      background: #fff; color: #161823; border-radius: 12px; padding: 9px 12px;
      font-weight: 800; font-size: .95rem; display: flex; align-items: center; gap: 7px;
      box-shadow: 0 4px 12px rgba(0,0,0,.3); white-space: nowrap;
      outline: 3px solid var(--gold); outline-offset: 2px;
    }
    .join-ico {
      background: linear-gradient(135deg, var(--tg), var(--wa)); color: #fff;
      border-radius: 999px; padding: 9px 18px; font-weight: 900; font-size: 1rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .tap { animation: tap 1.6s ease-in-out infinite; }
    .s2 .tap { animation-delay: .4s; } .s3 .tap { animation-delay: .8s; }
    @keyframes tap { 0%,70%,100% { transform: scale(1); } 80% { transform: scale(.9); } }

    /* ---------- Real-browser view ---------- */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; min-height: 66px; border-radius: 20px; margin-bottom: 14px;
      color: #fff; text-decoration: none; font-size: 1.3rem; font-weight: 900;
      box-shadow: 0 10px 26px rgba(0,0,0,.3);
      transition: transform .12s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn-tg { background: linear-gradient(135deg, #2aabee, #1d8ccc); }
    .btn-wa { background: linear-gradient(135deg, #2fe07a, #1ebe5d); }
    .foot { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="corner r" aria-hidden="true">
    <svg viewBox="0 0 64 64"><path d="M14 50 L46 18" stroke="#ffd34d" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M24 14 H50 V40" stroke="#ffd34d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span class="lbl">לחצו על 3 הנקודות ⋯<br>ואז 🌐 פתח בדפדפן</span>
  </div>
  <div class="corner l" aria-hidden="true">
    <svg viewBox="0 0 64 64"><path d="M50 50 L18 18" stroke="#ffd34d" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M40 14 H14 V40" stroke="#ffd34d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span class="lbl">לחצו על 3 הנקודות ⋯<br>ואז 🌐 פתח בדפדפן</span>
  </div>

  <main>
    <img class="avatar" src="pini.jpg" width="96" height="96" alt="פיני">
    <h1>פיני מוצא לך בזול 🦝💵</h1>

    <section id="guide">
      <p class="sub">3 לחיצות ואתם בקבוצה:</p>
      <div class="steps">
        <div class="step s1">
          <span class="num">1</span>
          <span class="txt">לחצו למעלה</span>
          <span class="vis tap"><span class="dots-ico"><i></i><i></i><i></i></span></span>
        </div>
        <div class="step s2">
          <span class="num">2</span>
          <span class="txt">בחרו</span>
          <span class="vis tap"><span class="menu-ico">🌐 פתח בדפדפן</span></span>
        </div>
        <div class="step s3">
          <span class="num">3</span>
          <span class="txt">ולחצו</span>
          <span class="vis tap"><span class="join-ico">הצטרפו ✅</span></span>

      </div>
    </section>

    <section id="apps">
      <p class="sub">הדילים הכי שווים מאלי אקספרס — כל יום 🔥</p>
      <a id="open-tg" class="btn btn-tg" href="https://t.me/pinitheraccoon" rel="noopener">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.5 3.3 18.4 21c-.2 1.1-.8 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.2.3-.5.5-.9.5l.3-4.8 8.8-8c.4-.3 0-.5-.6-.2l-10.9 6.9-4.7-1.5c-1-.3-1-.9.2-1.4L20 2.6c.8-.3 1.5.2 1.5.7z"/></svg>
        הצטרפו בטלגרם
      </a>
      <a id="open-wa" class="btn btn-wa" href="https://chat.whatsapp.com/JEhehJTm0lXJl5LZw6cHCM" rel="noopener">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.5 2 2.03 6.45 2.03 12c0 1.76.46 3.48 1.34 5L2 22l5.16-1.34A10 10 0 0 0 12.04 22C17.57 22 22 17.54 22 12S17.57 2 12.04 2zm5.85 14.27c-.24.68-1.4 1.3-1.94 1.35-.5.04-1.12.07-1.81-.11-.42-.12-.95-.3-1.64-.6-2.89-1.25-4.77-4.16-4.92-4.35-.14-.2-1.18-1.57-1.18-3 0-1.42.73-2.12 1-2.4.24-.27.64-.39 1.02-.39h.73c.23 0 .55-.1.86.66.32.77 1.08 2.65 1.17 2.84.1.2.16.42.03.68-.13.27-.2.43-.4.66-.2.23-.41.51-.59.69-.18.18-.37.37-.16.72.2.34.9 1.48 1.93 2.4 1.33 1.18 2.45 1.55 2.8 1.72.35.18.55.15.75-.09.2-.23.87-1.01 1.1-1.36.23-.34.46-.28.77-.16.32.11 2.03.96 2.38 1.13.35.18.58.26.66.41.09.15.09.86-.16 1.54z"/></svg>
        הצטרפו בוואטסאפ
      </a>
      <p class="foot">בחינם · בלי ספאם 🦝</p>
    </section>
  </main>

  <script>
    (function () {
      var DOMAIN = 'pinitheraccoon';
      var TG_HTTPS = 'https://t.me/' + DOMAIN;
      var TG_SCHEME = 'tg://resolve?domain=' + DOMAIN;
      var WA_HTTPS = 'https://chat.whatsapp.com/JEhehJTm0lXJl5LZw6cHCM';
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isTikTok = /BytedanceWebview|musical_ly|TikTok|AppName\/ultralite|AppName\/trill|\btrill\b|trill_/i.test(ua);
      var fromTt = false;
      try { fromTt = new URL(location.href).searchParams.get('from') === 'tt'; } catch (e) {}
      var inTikTok = isTikTok && !fromTt;
      /* Silent funnel counter (abacus.jasoncameron.dev, free, no account, no cookies).
         Keys: tt_view, browser_view, tg_click, wa_click. ?ctest=1 counts into test_* keys. */
      var CT_PREFIX = /[?&]ctest=1/.test(location.search) ? 'test_' : '';
      function ping(key) {
        var u = 'https://abacus.jasoncameron.dev/hit/pinideals-tg/' + CT_PREFIX + key + '?t=' + Date.now();
        try {
          if (window.fetch) { fetch(u, { keepalive: true, mode: 'no-cors', cache: 'no-store', credentials: 'omit' }).catch(function () {}); return true; }
        } catch (e) {}
        try { (new Image()).src = u; } catch (e) {}
        return false;
      }
      if (inTikTok) { document.body.classList.add('tiktok'); ping('tt_view'); return; }
      ping('browser_view');
      /* Real browser: open the apps directly where possible. */
      var openTg = document.getElementById('open-tg');
      var openWa = document.getElementById('open-wa');
      if (isAndroid) {
        openTg.setAttribute('href', 'intent://resolve?domain=' + DOMAIN + '#Intent;scheme=tg;package=org.telegram.messenger;S.browser_fallback_url=' + encodeURIComponent(TG_HTTPS) + ';end');
        openWa.setAttribute('href', 'intent://chat.whatsapp.com/JEhehJTm0lXJl5LZw6cHCM#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=' + encodeURIComponent(WA_HTTPS) + ';end');
      } else if (isIOS) {
        openTg.setAttribute('href', TG_SCHEME);
      }
      function track(el, key) {
        el.addEventListener('click', function (ev) {
          if (ping(key)) return; /* fetch keepalive survives navigation */
          /* No fetch: give the image ping a moment before navigating. */
          var href = el.getAttribute('href');
          ev.preventDefault();
          setTimeout(function () { location.href = href; }, 250);
        });
      }
      track(openTg, 'tg_click');
      track(openWa, 'wa_click');
    })();
  </script>
</body>
</html>
