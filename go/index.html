<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A11610">
  <meta name="robots" content="noindex">
  <title>החנות של פיני</title>
  <!-- v=20 -->
  <style>
    @font-face {
      font-family: Assistant;
      src: url("../shop/Assistant.ttf") format("truetype");
      font-weight: 200 800;
      font-display: swap;
    }
    :root {
      --cream: #FFF6EA;
      --ink: #2A2118;
      --muted: #F3D2B8;
      --terra: #C45C26;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100dvh;
      background: #A11610;
      color: var(--cream);
      font-family: Assistant, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse 90% 55% at 50% 46%, rgba(255, 176, 48, .32) 0%, rgba(255, 176, 48, 0) 62%),
        radial-gradient(ellipse 120% 70% at 50% 100%, rgba(70, 6, 4, .55) 0%, transparent 62%),
        linear-gradient(165deg, #E03A22 0%, #C02516 38%, #8B120E 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(255, 236, 210, .11) 1.1px, transparent 1.2px);
      background-size: 22px 22px;
    }
    .corners { display: none; }
    body[data-mode="inapp"] .corners { display: block; }
    .corner {
      position: fixed;
      top: max(4px, env(safe-area-inset-top));
      z-index: 20;
      pointer-events: none;
      width: 152px;
    }
    .corner.right { right: 8px; left: auto; }
    .corner.left { left: 8px; right: auto; }
    .arrow-wrap {
      width: 64px;
      height: 64px;
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 6px rgba(80, 0, 0, .35));
    }
    .corner.right .arrow-wrap { margin-left: auto; animation: nudgeR 1.6s ease-in-out infinite; }
    .corner.left .arrow-wrap { margin-right: auto; animation: nudgeL 1.6s ease-in-out infinite; }
    .corner.left svg { transform: scaleX(-1); }
    .arrow-wrap svg { width: 64px; height: 64px; display: block; }
    @keyframes nudgeR {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(4px, -5px); }
    }
    @keyframes nudgeL {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-4px, -5px); }
    }
    .hint {
      width: max-content;
      max-width: 152px;
      background: rgba(42, 10, 6, .58);
      border: 1px solid rgba(255, 232, 204, .22);
      border-radius: 12px;
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--cream);
      direction: rtl;
      text-align: right;
      box-shadow: 0 6px 16px rgba(40, 0, 0, .22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .corner.right .hint { margin-left: auto; }
    .corner.left .hint { margin-right: auto; }
    .hint span { display: block; }
    .hint .en {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      direction: ltr;
      text-align: right;
    }
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 3px #FFF6EA, 0 0 0 7px rgba(255, 186, 70, .45), 0 10px 28px rgba(80, 0, 0, .35);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--cream);
      text-shadow: 0 2px 10px rgba(70, 0, 0, .35);
    }
  </style>
</head>
<body>
  <div class="corners" id="tt-guide" hidden>
    <div class="corner left">
      <div class="arrow-wrap">
        <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <path d="M22 80C22 44 44 20 80 16" stroke="#FFF6EA" stroke-width="8" stroke-linecap="round"/>
          <path d="M58 12L84 12L84 38" stroke="#FFF6EA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="hint">
        <span>1. לחצו על ⋯</span>
        <span>2. בחרו ״פתיחה בדפדפן״</span>
        <span class="en" dir="ltr">Open in browser</span>
      </p>
    </div>
    <div class="corner right">
      <div class="arrow-wrap">
        <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <path d="M22 80C22 44 44 20 80 16" stroke="#FFF6EA" stroke-width="8" stroke-linecap="round"/>
          <path d="M58 12L84 12L84 38" stroke="#FFF6EA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="hint">
        <span>1. לחצו על ⋯</span>
        <span>2. בחרו ״פתיחה בדפדפן״</span>
        <span class="en" dir="ltr">Open in browser</span>
      </p>
    </div>
  </div>
  <main id="guide" hidden>
    <img class="logo" src="../shop/img/pini.jpg" alt="פיני" width="68" height="68">
    <h1>פתחו בדפדפן כדי להיכנס לאתר</h1>
  </main>
  <script>
  (function () {
    var SHOP = "https://galkrisi43-beep.github.io/tg/shop/";
    var API = "https://84-13-70-240.sslip.io";

    function isTest() {
      var q = new URLSearchParams(location.search);
      if (q.get("ctest") === "1") {
        try { localStorage.setItem("pini_ctest", "1"); } catch (e) {}
      }
      try { return localStorage.getItem("pini_ctest") === "1"; } catch (e) { return false; }
    }

    function shopUrl() {
      var u = new URL(SHOP);
      if (isTest()) u.searchParams.set("ctest", "1");
      return u.toString();
    }

    function inAppName() {
      var ua = navigator.userAgent || "";
      if (/BytedanceWebview|TikTok|musical_ly/i.test(ua)) return "tiktok";
      if (/Barcelona/i.test(ua)) return "threads";
      if (/Instagram/i.test(ua)) return "instagram";
      if (/FBAN|FBAV|FB_IAB/i.test(ua)) return "facebook";
      return "";
    }
    function isTrapInApp() {
      var ua = navigator.userAgent || "";
      return !!inAppName()
        || /Line\/|Snapchat|Twitter|Pinterest|MicroMessenger/i.test(ua)
        || (/Android/i.test(ua) && /; wv\)/.test(ua));
    }

    function source() {
      var ua = (navigator.userAgent || "").toLowerCase();
      var q = new URLSearchParams(location.search);
      if (q.get("utm_source") === "tiktok" || q.get("from") === "tt" || inAppName() === "tiktok" || /tiktok|musical_ly/.test(ua)) return "tiktok";
      if (inAppName() === "instagram" || /instagram/.test(ua)) return "instagram";
      if (inAppName() === "facebook") return "facebook";
      return "direct";
    }
    function device() {
      return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "") ? "mobile" : "desktop";
    }
    function inapp() { return inAppName() || "none"; }

    function track(ev) {
      if (isTest()) return;
      var payload = Object.assign({
        ts: Math.floor(Date.now() / 1000),
        source: source(),
        device: device(),
        inapp: inapp(),
        page: "landing"
      }, ev);
      try {
        fetch(API + "/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ events: [payload] }),
          credentials: "include",
          keepalive: true
        }).catch(function () {});
      } catch (e) {}
    }

    var trapped = isTrapInApp();
    document.body.setAttribute("data-mode", trapped ? "inapp" : "browser");

    if (!trapped) {
      track({ kind: "page" });
      location.replace(shopUrl());
      return;
    }

    var guide = document.getElementById("guide");
    var arrow = document.getElementById("tt-guide");
    if (guide) guide.hidden = false;
    if (arrow) arrow.hidden = false;
    track({ kind: "page" });
  })();
  </script>
</body>
</html>
