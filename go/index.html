<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7EFE4">
  <meta name="robots" content="noindex">
  <title>החנות של פיני</title>
  <!-- v=18 -->
  <style>
    @font-face {
      font-family: Assistant;
      src: url("../shop/Assistant.ttf") format("truetype");
      font-weight: 200 800;
      font-display: swap;
    }
    :root {
      --cream: #F7EFE4;
      --paper: #FFF8F1;
      --ink: #2A2118;
      --muted: #8A7A6C;
      --terra: #C45C26;
      --terra-deep: #A24618;
      --peach: #F3D2B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100dvh;
      background: var(--cream);
      color: var(--ink);
      font-family: Assistant, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 100px 22px calc(28px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #FFF8F1 0%, #F7EFE4 55%);
    }
    .corner {
      display: none;
      position: fixed;
      top: max(4px, env(safe-area-inset-top));
      right: 10px;
      left: auto;
      z-index: 20;
      pointer-events: none;
      width: 92px;
      height: 92px;
    }
    body[data-mode="inapp"] .corner { display: block; }
    .corner svg {
      width: 92px;
      height: 92px;
      display: block;
      transform-origin: 78% 18%;
      animation: nudge 1.6s ease-in-out infinite;
    }
    @keyframes nudge {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(5px, -6px); }
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--peach);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    .finger {
      display: block;
      font-size: 28px;
      line-height: 1;
      margin: 0 0 22px;
    }
    .steps {
      list-style: none;
      display: grid;
      gap: 12px;
      text-align: right;
    }
    .steps li {
      display: grid;
      grid-template-columns: 36px 44px 1fr;
      align-items: center;
      gap: 12px;
      background: var(--paper);
      border: 1px solid #eadccb;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 6px 16px rgba(80, 40, 10, .06);
    }
    .steps li.step-two {
      grid-template-columns: 36px 1fr;
      align-items: start;
    }
    .step-two .body { text-align: right; }
    .num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--terra);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .visual { display: flex; justify-content: center; }
    .dots {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2A2118;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .menu {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #eadccb;
      box-shadow: 0 2px 6px rgba(80, 40, 10, .06);
    }
    .menu-he {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
    }
    .menu-en {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.3;
    }
    .steps p {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="corner" id="tt-guide" hidden>
    <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
      <path d="M22 80C22 44 44 20 80 16" stroke="#C45C26" stroke-width="8" stroke-linecap="round"/>
      <path d="M58 12L84 12L84 38" stroke="#C45C26" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <main id="guide" hidden>
    <img class="logo" src="../shop/img/pini.jpg" alt="פיני" width="68" height="68">
    <h1>פתחו בדפדפן כדי להיכנס לאתר</h1>
    <span class="finger" aria-hidden="true">👇</span>
    <ol class="steps">
      <li>
        <span class="num">1</span>
        <div class="visual"><span class="dots" aria-hidden="true">⋯</span></div>
        <p>לחצו על ⋯ למעלה</p>
      </li>
      <li class="step-two">
        <span class="num">2</span>
        <div class="body">
          <p>בחרו ״פתיחה בדפדפן״</p>
          <span class="menu">
            <span class="menu-he">״פתיחה בדפדפן״</span>
            <span class="menu-en">Open in browser</span>
          </span>
        </div>
      </li>
    </ol>
  </main>
  <script>
  (function () {
    var SHOP = "https://galkrisi43-beep.github.io/tg/shop/";
    var API = "https://84-13-70-240.sslip.io";

    function isTest() {
      var q = new URLSearchParams(location.search);
      if (q.get("ctest") === "1") {
        try { localStorage.setItem("pini_ctest", "1"); } catch (e) {}
      }
      try { return localStorage.getItem("pini_ctest") === "1"; } catch (e) { return false; }
    }

    function shopUrl() {
      var u = new URL(SHOP);
      if (isTest()) u.searchParams.set("ctest", "1");
      return u.toString();
    }

    function inAppName() {
      var ua = navigator.userAgent || "";
      if (/BytedanceWebview|TikTok|musical_ly/i.test(ua)) return "tiktok";
      if (/Barcelona/i.test(ua)) return "threads";
      if (/Instagram/i.test(ua)) return "instagram";
      if (/FBAN|FBAV|FB_IAB/i.test(ua)) return "facebook";
      return "";
    }
    function isTrapInApp() {
      var ua = navigator.userAgent || "";
      return !!inAppName()
        || /Line\/|Snapchat|Twitter|Pinterest|MicroMessenger/i.test(ua)
        || (/Android/i.test(ua) && /; wv\)/.test(ua));
    }

    function source() {
      var ua = (navigator.userAgent || "").toLowerCase();
      var q = new URLSearchParams(location.search);
      if (q.get("utm_source") === "tiktok" || q.get("from") === "tt" || inAppName() === "tiktok" || /tiktok|musical_ly/.test(ua)) return "tiktok";
      if (inAppName() === "instagram" || /instagram/.test(ua)) return "instagram";
      if (inAppName() === "facebook") return "facebook";
      return "direct";
    }
    function device() {
      return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "") ? "mobile" : "desktop";
    }
    function inapp() { return inAppName() || "none"; }

    function track(ev) {
      if (isTest()) return;
      var payload = Object.assign({
        ts: Math.floor(Date.now() / 1000),
        source: source(),
        device: device(),
        inapp: inapp(),
        page: "landing"
      }, ev);
      try {
        fetch(API + "/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ events: [payload] }),
          credentials: "include",
          keepalive: true
        }).catch(function () {});
      } catch (e) {}
    }

    var trapped = isTrapInApp();
    document.body.setAttribute("data-mode", trapped ? "inapp" : "browser");

    if (!trapped) {
      track({ kind: "page" });
      location.replace(shopUrl());
      return;
    }

    var guide = document.getElementById("guide");
    var arrow = document.getElementById("tt-guide");
    if (guide) guide.hidden = false;
    if (arrow) arrow.hidden = false;
    track({ kind: "page" });
  })();
  </script>
</body>
</html>
